name: Verify AnoTime prototype

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"
      - "fix/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python, Swift and release contracts
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Python regression suite
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -p 'test_*.py'
      - name: Native notch compile and planner contracts
        run: |
          swift build -c release --package-path native_notch
          swift run --package-path native_notch PlannerTests
      - name: Public-release secret audit
        run: python tools/release_audit.py .
